common:
  img_topic: "/left_camera/image"
  lid_topic: "/livox/lidar"
  imu_topic: "/livox/imu"
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false

extrin_calib:
  extrinsic_T: [0.04165, 0.02326, -0.0284]
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
  Rcl: [0.00610193,-0.999863,-0.0154172,
        -0.00615449,0.0153796,-0.999863,
        0.999962,0.00619598,-0.0060598] 
  Pcl: [0.0194384, 0.104689,-0.0251952]

time_offset: 
  imu_time_offset: 0.0
  img_time_offset: 0.1
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 1
  filter_size_surf: 0.1
  lidar_type: 1 # Livox Avia LiDAR
  scan_line: 6
  blind: 0.8

vio:
  max_iterations: 5
  outlier_threshold: 1000 # 78 100 156 #100 200 500 700 infinite
  img_point_cov: 100 # 100 1000 
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  photometric_update_en: true
  exposure_estimate_en: true
  inv_expo_cov: 0.1

feature_vio:
  diagnostic_en: false
  max_features: 500
  quality_level: 0.01
  min_distance: 12.0
  depth_search_radius: 4
  inlier_thresh_px: 3.0
  min_depth: 0.5
  max_depth: 120.0
  fb_check_en: true
  fb_thresh_px: 1.5
  ransac_en: true
  lk_window_size: 21
  lk_max_level: 3
  lk_pyramid_cache_en: true
  lk_temporal_cache_en: true
  depth_image_reuse_en: true
  ransac_thresh_px: 1.5
  gate_min_inlier_ratio: 0.35
  gate_min_inliers: 30
  dry_run_en: true
  dry_run_damping: 1.0e-6
  dry_run_max_condition: 1.0e8
  update_en: false
  inekf_update_en: false
  frame_stride: 1
  img_point_cov: 100.0
  adaptive_weight_en: false
  adaptive_huber_px: 1.5
  adaptive_depth_sigma_px: 2.0
  adaptive_min_weight: 0.05
  update_scale: 1.0
  max_update_norm: 0.02
  max_rot_deg: 0.2
  max_pos_norm: 0.02
  bias_watchdog_en: false
  bias_watchdog_window: 200
  bias_watchdog_min_samples: 30
  bias_watchdog_max_rot_mean: 1.0e-4
  bias_watchdog_max_pos_mean: 1.0e-4

sa_livo:
  lio_saif_gate_en: false
  lio_saif_min_sqrt_info: 1.0
  lio_saif_min_weight: 0.0
  vio_saif_gate_en: false
  vio_saif_min_sqrt_info: 1.0
  vio_saif_min_weight: 0.0

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.5 # 0.2
  gyr_cov: 0.3 # 0.5
  b_acc_cov: 0.0001 # 0.1
  b_gyr_cov: 0.0001 # 0.1

lio:
  max_iterations: 5
  correspondence_rot_thresh_deg: 0.5
  correspondence_pos_thresh: 0.05
  adaptive_correspondence_refresh_en: false
  adaptive_success_rate_drop: 0.03
  adaptive_residual_ratio: 1.25
  info_eigen_log_en: false
  saturation_priority_en: false
  saturation_priority_score_margin: 0.05
  plane_point_score_en: false
  plane_point_score_weight: 0.0
  adaptive_plane_point_score_en: false
  adaptive_plane_score_margin: 0.05
  adaptive_plane_point_score_weight: 0.0
  adaptive_plane_min_points: 20
  planarity_score_penalty_en: false
  planarity_score_penalty_thresh: 0.15
  planarity_score_penalty_weight: 0.0
  use_planarity_ratio: false
  planarity_ratio_thresh: 0.05
  dept_err: 0.02
  beam_err: 0.05
  min_eigen_value: 0.0025 # 0.005
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 50
  layer_init_num: [5, 5, 5, 5, 5]

local_map:  
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: true
  pub_effect_point_en: false 
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0

evo:
  seq_name: "CBD_Building_01"
  pose_output_en: false

pcd_save:
  pcd_save_en: false
  type: 0 # 0: World Frame, 1: Body Frame;
  colmap_output_en: false # need to set interval = -1
  filter_size_pcd: 0.15
  interval: -1
  # how many LiDAR frames saved in each pcd file;
  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

image_save:
  img_save_en: false
  interval: 1
